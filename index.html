<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Weather</title>
  <meta name="description" content="Hourly temperature, rainfall and wind for the next 5 days.">

  <!-- iOS home-screen app behavior -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weather">
  <meta name="theme-color" content="#0f1117">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.json">

  <!-- ?v= values are content hashes, rewritten by .githooks/pre-commit -->
  <link rel="stylesheet" href="style.css?v=79ae54df">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
          integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC"
          crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-row">
        <h1>5-Day Forecast</h1>
        <button type="button" id="refresh-btn" class="refresh-btn" aria-label="Refresh forecast" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
            <polyline points="21 3 21 8 16 8"/>
          </svg>
        </button>
      </div>
      <p class="subline">
        <span id="location-label"></span>
        <span id="last-updated" class="last-updated" aria-live="polite"></span>
      </p>
    </header>

    <!-- Search (sticky) -->
    <div class="toolbar">
      <form id="search-form" class="search-container" role="search" autocomplete="off">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search-input" placeholder="Search city…"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 enterkeyhint="search" aria-label="Search for a city"
                 aria-controls="search-dropdown">
        </div>
        <div class="search-dropdown" id="search-dropdown"></div>
      </form>
    </div>

    <!-- Global legend -->
    <div class="legend-bar">
      <div class="legend-item"><span class="legend-swatch temp" aria-hidden="true"></span> Temp °C</div>
      <div class="legend-item"><span class="legend-swatch feels" aria-hidden="true"></span> Feels like</div>
      <div class="legend-item"><span class="legend-swatch precip" aria-hidden="true"></span> Rain mm</div>
      <div class="legend-item">
        <span class="legend-swatch wind" aria-hidden="true"></span>
        <label for="wind-threshold">Wind &gt;</label>
        <select id="wind-threshold" class="wind-select"></select> mph
      </div>
      <div class="legend-item"><span class="legend-swatch gust" aria-hidden="true"></span> Gusts ≥ <span id="gust-threshold"></span> mph</div>
    </div>

    <!-- Loading indicator -->
    <div id="loading" role="status">
      <div class="spinner" aria-hidden="true"></div>
      Fetching forecast…
    </div>

    <!-- Charts mount here -->
    <div id="charts-container"></div>
  </div>

  <script src="app.js?v=9631fb51"></script>
</body>
</html>
